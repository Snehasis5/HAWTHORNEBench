# Pilot: any OpenCode model as the target (default DeepSeek V4.1 Flash) against 50 scripted red and 50 scripted blue agents.
#   export OPENCODE_API_KEY=...
#   hawthornebench check -c pilot_deepseek
#   hawthornebench run   -c pilot_deepseek --live
#   hawthornebench run   -c pilot_deepseek --live --target opencode-go:glm-5.3   # any other OpenCode Go model
# 1 seed x 1 condition (evaluation only) x 36 rounds = 36 target calls. The red and blue teams are scripted (no API calls).

[experiment]
name = "pilot_deepseek"
seeds = 1
conditions = ["evaluation"]
out_dir = "runs/pilot_deepseek"
parallel_episodes = 1
max_concurrency = 4
cache_dir = "runs/.llm_cache"

[world]
days = 3

[swarm]
post_probability = 0.05        # per agent per round: with 100 agents, about 5 posts a round
control_red = "neutral"
red_style = "explicit"
blue_style = "supportive"
board_window = 12

[judge]
kind = "regex"

[models.target_model]
# Any OpenCode text model works: change `model` here, or pass --target opencode-go:<id> on the command line.
# See what is available with:  hawthornebench models opencode-go
provider = "openai_compatible"
base_url = "https://opencode.ai/inference/go/openai/v1"   # OpenCode Go; pay-as-you-go credit: https://opencode.ai/inference/openai/v1
model = "deepseek-v4.1-flash"
api_key_env = "OPENCODE_API_KEY"
temperature = 0.7
max_tokens = 2000                                 # room for models that reason before answering
timeout_s = 120
max_retries = 3

[target]
kind = "llm"
model = "target_model"
history_turns = 8
belief_elicitation = "every_round"

[red]
count = 50
kind = "scripted"

[blue]
count = 50
kind = "scripted"
