# Survival Island: target, red team and blue team on different providers.
# Keys are read from the environment variables named in api_key_env.

[experiment]
name = "mixed_providers"
seeds = 20
conditions = ["evaluation", "control"]
out_dir = "runs/mixed_providers"
max_concurrency = 6
parallel_episodes = 2
cache_dir = "runs/.llm_cache"    # identical requests are answered from disk; delete to re-query

[world]
days = 5

[swarm]
post_probability = 0.45
control_red = "neutral"

# ---- models: any number; reference them by name below
[models.gpt]
provider = "openai"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"
temperature = 0.7

[models.claude]
provider = "anthropic"
model = "claude-3-5-haiku-latest"     # use any model id your account has
api_key_env = "ANTHROPIC_API_KEY"

[models.gemini]
provider = "gemini"
model = "gemini-1.5-flash"
api_key_env = "GEMINI_API_KEY"

[models.llama_local]
provider = "openai_compatible"        # Ollama, vLLM, LM Studio, llama.cpp, OpenRouter, Together, Groq ...
base_url = "http://localhost:11434/v1"
model = "llama3.1"

# ---- who plays what
[target]
kind = "llm"
model = "claude"
history_turns = 8

[red]
kind = "llm"
  [[red.members]]
  model = "gpt"
  [[red.members]]
  model = "gemini"
  [[red.members]]
  model = "llama_local"

[blue]
kind = "llm"
count = 3
model = "gpt"
