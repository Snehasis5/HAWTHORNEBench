[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hawthornebench"
version = "0.3.0"
description = "HAWTHORNEBench: a multi-agent adversarial simulation for measuring the evaluation awareness-performance trade-off"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "jsonschema", "tomli; python_version < '3.11'"]
toml = ["tomli; python_version < '3.11'"]

[project.scripts]
hawthornebench = "hawthornebench.__main__:main"

[tool.setuptools.packages.find]
include = ["hawthornebench*"]

[tool.setuptools.package-data]
hawthornebench = ["viewer/*.html", "configs/*.toml"]
