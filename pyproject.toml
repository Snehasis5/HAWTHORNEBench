[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-island"
version = "0.3.0"
description = "Plug-and-play multi-agent harness: does evaluation awareness make an agent underperform?"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "jsonschema", "tomli; python_version < '3.11'"]
toml = ["tomli; python_version < '3.11'"]

[project.scripts]
survival-island = "survival_island.__main__:main"

[tool.setuptools.packages.find]
include = ["survival_island*"]

[tool.setuptools.package-data]
survival_island = ["viewer/*.html", "configs/*.toml"]
