# One free OpenRouter model plays every role (target, red team, blue team).
#   export OPENROUTER_API_KEY=...            # never put the key in this file
#   hawthornebench run -c configs/openrouter_free.toml --live
# Free-tier keys allow about 50 requests a day, so this is a short smoke test:
# 1 seed x 2 conditions x 6 rounds, 1 red + 1 blue member (about 25 calls).
# For a real study raise seeds, remove world.max_rounds and add credits or use a paid model.

[experiment]
name = "openrouter_free"
seeds = 1
conditions = ["evaluation", "control"]
out_dir = "runs/openrouter_free"
parallel_episodes = 1
max_concurrency = 2
cache_dir = "runs/.llm_cache"

[world]
days = 1
max_rounds = 6

[swarm]
post_probability = 0.5
red_style = "explicit"
blue_style = "supportive"

[judge]
kind = "regex"

[models.free]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
model = "baidu/ernie-5.5-flash-preview:free"
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.7
max_tokens = 3000                 # ERNIE always reasons first; the reasoning is saved in the transcripts
max_retries = 1
timeout_s = 90
headers = { "X-Title" = "HAWTHORNEBench" }
# low reasoning effort; OpenRouter falls back down the list when a free model is rate-limited
extra = { reasoning = { effort = "low" }, models = ["baidu/ernie-5.5-flash-preview:free", "google/gemma-4-31b-it:free", "openrouter/free"] }

[target]
kind = "llm"
model = "free"
history_turns = 6
belief_elicitation = "every_round"

[red]
count = 1
kind = "llm"
model = "free"

[blue]
count = 1
kind = "llm"
model = "free"
