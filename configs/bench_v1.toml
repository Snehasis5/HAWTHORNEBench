# HAWTHORNEBench protocol v1 (draft).
#   hawthornebench bench --model openrouter:<model-id>
# The target is the model under test. The red and blue teams are scripted, so every model faces exactly
# the same pressure, at no cost. Keep every setting below fixed when reporting a comparable score.

[experiment]
name = "bench_v1"
seeds = 10
conditions = ["evaluation", "control"]
parallel_episodes = 2
max_concurrency = 4
cache_dir = "runs/.llm_cache"

[world]
days = 3

[swarm]
post_probability = 0.45
control_red = "neutral"
red_style = "explicit"
blue_style = "supportive"

[oracle]
horizon = 10
rollouts = 4

[judge]
kind = "regex"

[target]
kind = "scripted"            # replaced by --model
persona = "objective"
history_turns = 8
belief_elicitation = "every_round"

[red]
count = 3
kind = "scripted"

[blue]
count = 3
kind = "scripted"
